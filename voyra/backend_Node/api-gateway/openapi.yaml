components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT iz `POST /api/users/login`. Vazi 24 h, a prestaje da vazi ranije kada se promeni
        lozinka, uloga ili status naloga (claim `tv`).
    internalKey:
      type: apiKey
      in: header
      name: X-Internal-Key
      description: Zajednicki kljuc iz `.env`-a. Ove rute NISU dostupne spolja - gateway ih ne prosledjuje.
  schemas:
    Greska:
      type: object
      required:
        - success
        - error
        - message
        - statusCode
      properties:
        success:
          type: boolean
          enum:
            - false
          description: Uvek `false` kod greske
        error:
          type: string
          description: Masinski citljiv kod greske
          example: VALIDATION_ERROR
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: Poruka za korisnika; Joi validacija vraca listu poruka
        statusCode:
          type: integer
          example: 400
        errors:
          type: array
          items:
            type: string
          description: Pojedinacne greske validacije, kada ih servis salje
        attemptsLeft:
          type: integer
          description: Koliko pokusaja ostaje pre zakljucavanja (prijava, SMS kod, lozinka)
        retryAfter:
          type: integer
          description: Sekundi do isteka zakljucavanja (uz 429)
        currentVersion:
          type: string
          description: Trenutna verzija putovanja kod 409 VERSION_CONFLICT

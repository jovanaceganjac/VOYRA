# GENERISANO skriptom backend_Node/shared/napravi-openapi.js
# Opisi se menjaju u shared/openapi-opisi.js, pa se skripta pokrene ponovo.
openapi: 3.0.3
info:
  title: Voyra Admin Service
  version: 1.0.0
  description: >-
    Administracija korisnika i sadrzaja, statistika i revizioni zapisi (spec §3.3).


    Svi odgovori su JSON. Uspeh nosi `success: true`, a greska zajednicku semu `Greska`.
    Dokumentacija se iskljucuje sa `DOCS_ENABLED=false`.
servers:
  - url: http://localhost:4005
    description: Lokalni razvoj
tags:
  - name: Servis
  - name: Administracija
  - name: Interno
paths:
  /:
    get:
      summary: Spisak ruta servisa
      tags:
        - Servis
      responses:
        "200":
          description: Uspeh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    description: Sadrzaj odgovora; oblik zavisi od rute
                  statusCode:
                    type: integer
                    example: 200
        "400": &a1
          description: Neispravan zahtev (validacija)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Greska"
              example:
                success: false
                error: VALIDATION_ERROR
                message: Neispravni podaci
                errors:
                  - checkIn je obavezan
                statusCode: 400
        "404": &a2
          description: Resurs nije pronadjen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Greska"
              example:
                success: false
                error: NOT_FOUND
                message: Putovanje nije pronadjeno
                statusCode: 404
        "503": &a3
          description: Servis iza gateway-a nije dostupan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Greska"
              example:
                success: false
                error: SERVICE_UNAVAILABLE
                message: Ciljni servis trenutno nije dostupan
                statusCode: 503
  /api/admin/attractions:
    get:
      summary: Atrakcije administratora za grad
      tags:
        - Administracija

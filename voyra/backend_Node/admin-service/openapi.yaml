                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    description: Sadrzaj odgovora; oblik zavisi od rute
                  statusCode:
                    type: integer
                    example: 200
        "400": *a1
        "401": *a4
        "403": *a5
        "404": *a2
        "503": *a3
      security:
        - bearerAuth: []

                    example: 200
        "400": *a1
        "401": &a4
          description: Nedostaje token, token je nevazeci ili je opozvan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Greska"
              example:
                success: false
                error: TOKEN_REVOKED
                message: Sesija je istekla ili je nalog promenjen. Prijavite se ponovo.
                statusCode: 401
        "403": &a5
          description: Nalog nema pravo pristupa (uloga ili status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Greska"
              example:
                success: false
                error: FORBIDDEN
                message: Samo administratori mogu da pristupe ovom resursu
                statusCode: 403
        "404": *a2
        "503": *a3
      security:
        - bearerAuth: []
    post:
      summary: Nova atrakcija administratora
      description: Koordinate moraju biti u krugu od 50 km od centra izabranog grada.
      tags:
        - Administracija
      responses:
        "200":
          description: Uspeh
          content:
            application/json:
              schema:

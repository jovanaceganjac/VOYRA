# GENERISANO skriptom backend_Node/shared/napravi-openapi.js
# Opisi se menjaju u shared/openapi-opisi.js, pa se skripta pokrene ponovo.
openapi: 3.0.3
info:
  title: Voyra User Service
  version: 1.0.0
  description: >-
    Nalozi, prijava, profil i promena lozinke (spec §4.10).


    Svi odgovori su JSON. Uspeh nosi `success: true`, a greska zajednicku semu `Greska`.
    Dokumentacija se iskljucuje sa `DOCS_ENABLED=false`.
servers:
  - url: http://localhost:4001
    description: Lokalni razvoj
tags:
  - name: Servis
  - name: Nalozi
  - name: Profil
  - name: Interno
paths:
  /:
    get:
      summary: Spisak ruta servisa
      tags:
        - Servis
      responses:
        "200":
          description: Uspeh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    description: Sadrzaj odgovora; oblik zavisi od rute
                  statusCode:
                    type: integer
                    example: 200
        "400": &a1
          description: Neispravan zahtev (validacija)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Greska"
              example:
                success: false
                error: VALIDATION_ERROR
                message: Neispravni podaci
                errors:
                  - checkIn je obavezan
                statusCode: 400
        "404": &a2
          description: Resurs nije pronadjen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Greska"
              example:
                success: false
                error: NOT_FOUND
                message: Putovanje nije pronadjeno
                statusCode: 404
        "503": &a3
          description: Servis iza gateway-a nije dostupan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Greska"
              example:
                success: false
                error: SERVICE_UNAVAILABLE
                message: Ciljni servis trenutno nije dostupan
                statusCode: 503
  /api/users/{id}:
    delete:
      summary: Brisanje naloga
      tags:
        - Interno
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Vrednost parametra `id`
      responses:
        "200":
          description: Uspeh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    description: Sadrzaj odgovora; oblik zavisi od rute
                  statusCode:
                    type: integer
                    example: 200
        "400": *a1
        "401": &a4
          description: Nedostaje token, token je nevazeci ili je opozvan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Greska"
              example:
                success: false
                error: TOKEN_REVOKED
                message: Sesija je istekla ili je nalog promenjen. Prijavite se ponovo.
                statusCode: 401
        "404": *a2
        "503": *a3
      security:
        - internalKey: []
      description: "**Interno.** Poziva ga drugi servis, ne klijent."
  /api/users/{id}/role:
    patch:
      summary: Promena uloge naloga
      tags:
        - Interno
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Vrednost parametra `id`
      responses:
        "200":
          description: Uspeh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    description: Sadrzaj odgovora; oblik zavisi od rute
                  statusCode:
                    type: integer
                    example: 200
        "400": *a1
        "401": *a4
        "404": *a2
        "503": *a3
      security:
        - internalKey: []
      description: "**Interno.** Poziva ga drugi servis, ne klijent."
  /api/users/{id}/status:
    patch:
      summary: Promena statusa naloga
      tags:
        - Interno
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Vrednost parametra `id`
      responses:
        "200":
          description: Uspeh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    description: Sadrzaj odgovora; oblik zavisi od rute
                  statusCode:
                    type: integer
                    example: 200
        "400": *a1
        "401": *a4
        "404": *a2
        "503": *a3
      security:
        - internalKey: []
      description: "**Interno.** Poziva ga drugi servis, ne klijent."
  /api/users/all:
    get:
      summary: Svi korisnici
      tags:
        - Interno
      responses:
        "200":
          description: Uspeh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    description: Sadrzaj odgovora; oblik zavisi od rute
                  statusCode:
                    type: integer
                    example: 200
        "400": *a1
        "401": *a4
        "404": *a2
        "503": *a3
      security:
        - internalKey: []
      description: "**Interno.** Poziva ga drugi servis, ne klijent."
  /api/users/internal/{id}:
    get:
      summary: Podaci korisnika za slanje obavestenja
      tags:
        - Interno
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Vrednost parametra `id`
      responses:
        "200":
          description: Uspeh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    description: Sadrzaj odgovora; oblik zavisi od rute
                  statusCode:
                    type: integer
                    example: 200
        "400": *a1
        "401": *a4
        "404": *a2
        "503": *a3
      security:
        - internalKey: []
      description: "**Interno.** Poziva ga drugi servis, ne klijent."
  /api/users/internal/{id}/token-version:
    get:
      summary: Trenutna verzija tokena korisnika
      description: "**Interno.** Gateway je poredi sa claim-om `tv` iz tokena i odbija zahtev kada se ne
        poklapaju."
      tags:
        - Interno
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Vrednost parametra `id`
      responses:
        "200":
          description: Uspeh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    description: Sadrzaj odgovora; oblik zavisi od rute
                  statusCode:
                    type: integer
                    example: 200
        "400": *a1
        "401": *a4
        "404": *a2
        "503": *a3
      security:
        - internalKey: []
  /api/users/login:
    post:
      summary: Prijava korisnickim imenom i lozinkom
      description: Vraca JWT koji vazi 24 h. Pet neuspesnih pokusaja u 15 minuta po paru (korisnicko ime,
        IP) daje `429`. Poruka je ista za nepostojeceg korisnika i pogresnu lozinku, da se ne
        otkriva koji nalozi postoje.
      tags:
        - Nalozi
      responses:
        "200":
          description: Uspeh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    description: Sadrzaj odgovora; oblik zavisi od rute
                  statusCode:
                    type: integer
                    example: 200
        "400": *a1
        "404": *a2
        "429": &a6
          description: Previse pokusaja - zaglavlje `Retry-After` nosi vreme cekanja
          headers:
            Retry-After:
              schema:
                type: integer
              description: Sekundi do sledeceg pokusaja
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Greska"
              example:
                success: false
                error: RATE_LIMIT
                message: Previse pogresnih pokusaja. Pokusajte ponovo za 15 minuta
                retryAfter: 900
                statusCode: 429
        "503": *a3
  /api/users/me:
    get:
      summary: Profil prijavljenog korisnika
      tags:
        - Profil
      responses:
        "200":
          description: Uspeh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    description: Sadrzaj odgovora; oblik zavisi od rute
                  statusCode:
                    type: integer
                    example: 200
        "400": *a1
        "401": *a4
        "403": &a5
          description: Nalog nema pravo pristupa (uloga ili status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Greska"
              example:
                success: false
                error: FORBIDDEN
                message: Samo administratori mogu da pristupe ovom resursu
                statusCode: 403
        "404": *a2
        "503": *a3
      security:
        - bearerAuth: []
    put:
      summary: Izmena licnih podataka
      description: Nov ili izmenjen broj telefona gubi potvrdu i dobija nov kod SMS-om.
      tags:
        - Profil
      responses:
        "200":
          description: Uspeh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    description: Sadrzaj odgovora; oblik zavisi od rute
                  statusCode:
                    type: integer
                    example: 200
        "400": *a1
        "401": *a4
        "403": *a5
        "404": *a2
        "503": *a3
      security:
        - bearerAuth: []
  /api/users/me/password:
    put:
      summary: Promena lozinke
      description: Trenutna lozinka mora biti tacna (`400 WRONG_PASSWORD`), a nova razlicita od nje (`400
        SAME_PASSWORD`) i po istim pravilima kao pri registraciji. Uspeh ponistava SVE ranije tokene
        i vraca nov token za ovu sesiju.
      tags:
        - Profil
      responses:
        "200":
          description: Uspeh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    description: Sadrzaj odgovora; oblik zavisi od rute
                  statusCode:
                    type: integer
                    example: 200
        "400": *a1
        "401": *a4
        "403": *a5
        "404": *a2
        "429": *a6
        "503": *a3
      security:
        - bearerAuth: []
  /api/users/me/sms-preference:
    patch:
      summary: Ukljucivanje i iskljucivanje SMS obavestenja
      tags:
        - Profil
      responses:
        "200":
          description: Uspeh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    description: Sadrzaj odgovora; oblik zavisi od rute
                  statusCode:
                    type: integer
                    example: 200
        "400": *a1
        "401": *a4
        "403": *a5
        "404": *a2
        "503": *a3
      security:
        - bearerAuth: []
  /api/users/profile:
    get:
      summary: Podaci prijavljenog korisnika
      tags:
        - Nalozi
      responses:
        "200":
          description: Uspeh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    description: Sadrzaj odgovora; oblik zavisi od rute
                  statusCode:
                    type: integer
                    example: 200
        "400": *a1
        "401": *a4
        "403": *a5
        "404": *a2
        "503": *a3
      security:
        - bearerAuth: []
  /api/users/register:
    post:
      summary: Registracija korisnika
      description: Nalog se otvara u statusu `na_cekanju` i ceka odluku administratora. Lozinka mora imati
        najmanje 8 znakova, veliko i malo slovo, broj i poseban znak.
      tags:
        - Nalozi
      responses:
        "200":
          description: Uspeh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    description: Sadrzaj odgovora; oblik zavisi od rute
                  statusCode:
                    type: integer
                    example: 200
        "400": *a1
        "404": *a2
        "503": *a3
  /health:
    get:
      summary: Provera da servis radi
      tags:
        - Servis
      responses:
        "200":
          description: Uspeh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    description: Sadrzaj odgovora; oblik zavisi od rute
                  statusCode:
                    type: integer
                    example: 200
        "400": *a1
        "404": *a2
        "503": *a3
  /login:
    post:
      summary: Prijava (stara putanja, bez `/api/users`)
      tags:
        - Nalozi
      responses:
        "200":
          description: Uspeh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    description: Sadrzaj odgovora; oblik zavisi od rute
                  statusCode:
                    type: integer
                    example: 200
        "400": *a1
        "404": *a2
        "429": *a6
        "503": *a3
  /profile:
    get:
      summary: Profil (stara putanja, bez `/api/users`)
      tags:
        - Nalozi
      responses:
        "200":
          description: Uspeh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    description: Sadrzaj odgovora; oblik zavisi od rute
                  statusCode:
                    type: integer
                    example: 200
        "400": *a1
        "401": *a4
        "403": *a5
        "404": *a2
        "503": *a3
      security:
        - bearerAuth: []
  /register:
    post:
      summary: Registracija (stara putanja, bez `/api/users`)
      tags:
        - Nalozi
      responses:
        "200":
          description: Uspeh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    description: Sadrzaj odgovora; oblik zavisi od rute
                  statusCode:
                    type: integer
                    example: 200
        "400": *a1
        "404": *a2
        "503": *a3
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT iz `POST /api/users/login`. Vazi 24 h, a prestaje da vazi ranije kada se promeni
        lozinka, uloga ili status naloga (claim `tv`).
    internalKey:
      type: apiKey
      in: header
      name: X-Internal-Key
      description: Zajednicki kljuc iz `.env`-a. Ove rute NISU dostupne spolja - gateway ih ne prosledjuje.
  schemas:
    Greska:
      type: object
      required:
        - success
        - error
        - message
        - statusCode
      properties:
        success:
          type: boolean
          enum:
            - false
          description: Uvek `false` kod greske
        error:
          type: string
          description: Masinski citljiv kod greske
          example: VALIDATION_ERROR
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: Poruka za korisnika; Joi validacija vraca listu poruka
        statusCode:
          type: integer
          example: 400
        errors:
          type: array
          items:
            type: string
          description: Pojedinacne greske validacije, kada ih servis salje
        attemptsLeft:
          type: integer
          description: Koliko pokusaja ostaje pre zakljucavanja (prijava, SMS kod, lozinka)
        retryAfter:
          type: integer
          description: Sekundi do isteka zakljucavanja (uz 429)
        currentVersion:
          type: string
          description: Trenutna verzija putovanja kod 409 VERSION_CONFLICT

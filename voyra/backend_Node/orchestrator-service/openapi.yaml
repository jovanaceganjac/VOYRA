  /v1/plan:
    post:
      summary: Pravljenje plana putovanja
      description: "Pet faza algoritma (§6). Zaglavlje `X-Save-Trip: true` cuva putovanje (zahteva
        prijavu), a `X-Trip-ID` azurira postojece."
      tags:
